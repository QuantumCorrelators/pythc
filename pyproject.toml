[project]
name = "pythc"
version = "0.0.2"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "scipy (>=1.15.2,<2.0.0)",
    "numpy (>=2.2.5,<2.6.0)",
    "pandas (>=2.2.3,<4.0.0)",
    "pyscf (>=2.9.0,<3.0.0)",
    "scikit-learn (>=1.7.1)",
    "gitpython (>=3.1.44,<4.0.0)",
    "pytblis>=0.0.5",
    "opt-einsum>=3.4.0",
    "numba>=0.62.1",
    "python-dotenv>=1.2.1",
    "h5py>=3.15.1",
    "pyinstrument>=5.1.2",
    "cotengra>=0.8.0",
    "pymongo>=4.16.0",
    "basis-set-exchange>=0.12",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
cuda = [
    "cupy-cuda13x[ctk]>=14.0.1",
    "cuda-toolkit>=13.1.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "coverage (>=7.8.2,<8.0.0)",
    "duckdb>=1.3.2",
    "hypothesis>=6.151.9",
    "memory-profiler>=0.61.0",
    "notebook (>=7.4.3,<8.0.0)",
    "pandas-stubs~=2.3.3",
    "plop (>=0.4.0,<0.5.0)",
    "plotnine (>=0.15.0)",
    "py3dmol>=2.5.1",
    "pygwalker>=0.5.0.0",
    "pyperf>=2.10.0",
    "pytest>=9.0.2",
    "rdkit>=2025.3.3",
    "scikit-misc>=0.5.1",
    "scipy-stubs==1.16.0.2",
    "streamlit>=1.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
python-preference = "managed"


[tool.hatch.build.targets.sdist]
exclude = [
    "/benchmarks",
    "/.github",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
