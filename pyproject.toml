[project]
name = "pythc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "scipy (>=1.15.2,<2.0.0)",
    "numpy (>=2.2.5,<2.5.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "plotnine (>=0.15.0)",
    "pyscf (>=2.9.0,<3.0.0)",
    "scikit-learn (==1.7.1)",
    "coverage (>=7.8.2,<8.0.0)",
    "plop (>=0.4.0,<0.5.0)",
    "gitpython (>=3.1.44,<4.0.0)",
    "acccholesky @ git+https://github.com/nikplx/Randomly-Pivoted-Cholesky.git@v0.1.10",
    "memory-profiler>=0.61.0",
    "pytblis>=0.0.5",
    "pandas-stubs~=2.3.3",
    "mizani>=0.14.2",
    "scikit-misc>=0.5.1",
    "opt-einsum>=3.4.0",
    "numba>=0.62.1",
    "scipy-stubs>=1.16.0.2",
    "certifi>=2026.1.4",
    "python-dotenv>=1.2.1",
    "dnspython>=2.8.0",
    "h5py>=3.15.1",
    "pyinstrument>=5.1.2",
    "pyperf>=2.10.0",
    "hypothesis>=6.151.9",
    "pytest>=9.0.2",
    "cotengra>=0.8.0",
    "optuna>=4.8.0",
    "cmaes>=0.13.0",
    "kahypar>=1.3.7",
    "vl-convert-python>=1.9.0.post1",
    "ray>=2.55.1",
    "autoray>=0.8.10",
    "dask>=2026.3.0",
    "pymongo>=4.16.0",
    "basis-set-exchange>=0.12",
    "pip>=26.1.2",
    "ninja>=1.13.0",
    "editables>=0.6",
]

[project.optional-dependencies]
cuda = [
    "cupy-cuda13x[ctk]>=14.0.1",
    "cuda-toolkit>=13.1.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "duckdb>=1.3.2",
    "notebook (>=7.4.3,<8.0.0)",
    "plotnine (>=0.15.0)",
    "rdkit>=2025.3.3",
    "scipy-stubs==1.16.0.2",
    "py3dmol>=2.5.1",
    "scikit-misc>=0.5.1",
    "streamlit>=1.54.0",
    "pygwalker>=0.5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
python-preference = "managed"


[tool.hatch.build.targets.sdist]
exclude = [
    "/benchmarks",
    "/.github",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
